<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* Login Card */

.login-card{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0px 5px 15px rgba(0,0,0,0.1);
width:350px;
text-align:center;
}

h2{
color:#2f3e9e;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#2f3e9e;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1e2c7a;
}

.error{
  color:red;
  margin-bottom:10px;
}

.success{
  color:green;
  margin-bottom:10px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#2f3e9e;
  margin-bottom:20px;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">🚚 Logistics AI</div>

<h2>Login</h2>

<p style="font-size:14px; color:#555; margin-bottom:10px;">Use <strong>admin/admin123</strong> for admin access, or login as a user.</p>

{% if created %}
<p class="success">Account created successfully! Please sign in.</p>
{% endif %}

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/login">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<div style="margin-top:14px; text-align:center;">
  <span style="color:#555;">Don't have an account?</span>
  <a href="/signup" style="color:#2f3e9e; font-weight:bold; text-decoration:none;">Sign up</a>
</div>

</div>

</body>

</html>
